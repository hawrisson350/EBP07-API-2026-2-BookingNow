# Render + Supabase. Las tablas se administran desde el repositorio de BD.
logging.level.root=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.level.com.zaxxer.hikari=DEBUG
logging.level.org.postgresql=DEBUG
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=TRACE
logging.level.org.hibernate.engine.jdbc.connections.internal=TRACE
server.forward-headers-strategy=framework
# Evita que el arranque del servidor dependa de una conexion inmediata a Supabase.
spring.main.lazy-initialization=true
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.initialization-fail-timeout=-1
# La API debe iniciar aunque Supabase este reanudandose; Hikari reintentara al atender solicitudes.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
spring.jpa.properties.hibernate.default_schema=bookingnow
server.tomcat.threads.max=20
server.tomcat.threads.min-spare=2
# Diagnóstico temporal en Render: permite publicar /health sin crear JPA ni conectarse a Supabase.
spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration,org.springframework.boot.data.jpa.autoconfigure.DataJpaRepositoriesAutoConfiguration
management.health.db.enabled=false