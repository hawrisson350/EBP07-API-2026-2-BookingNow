spring.application.name=BookingNow
spring.config.import=optional:file:.env[.properties]
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level requestId=%X{requestId:-} %logger{40} - %msg%n
logging.level.co.edu.udea.bookingnow=INFO
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:4200}
spring.jackson.deserialization.accept-float-as-int=false
server.port=${PORT:8080}
security.jwt.secret=${JWT_SECRET}
security.jwt.issuer=bookingnow-api
security.jwt.audience=bookingnow
security.jwt.ttl-seconds=1800

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.disable-swagger-default-url=true

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bookingnow}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

management.endpoints.web.base-path=/
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=false
