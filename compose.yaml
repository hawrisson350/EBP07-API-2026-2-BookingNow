services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: bookingnow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD antes de iniciar Docker Compose}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bookingnow"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/bookingnow
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD antes de iniciar Docker Compose}
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres_data:
